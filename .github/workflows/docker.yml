name: build-and-publish

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          ALIYUN_USER="$(echo -n "${ALIYUN_USERNAME:-your_username}" | xargs)"
          ALIYUN_PWD="$(echo -n "$ALIYUN_PASSWORD" | tr -d '\r\n')"
          if [ -n "$ALIYUN_PWD" ]; then
            if echo "$ALIYUN_PWD" | docker login --username "$ALIYUN_USER" --password-stdin crpi-kbafcu5p49r7b1k1.cn-hangzhou.personal.cr.aliyuncs.com; then
              echo "ALIYUN_LOGGED_IN=true" >> $GITHUB_ENV
              echo "Successfully logged into Aliyun ACR as $ALIYUN_USER"
            elif echo "$ALIYUN_PWD" | docker login --username "$ALIYUN_USER" --password-stdin registry.cn-hangzhou.aliyuncs.com; then
              echo "ALIYUN_LOGGED_IN=true" >> $GITHUB_ENV
              echo "Successfully logged into Aliyun ACR (standard endpoint) as $ALIYUN_USER"
            fi
          fi

      - name: Determine Image Repositories
        id: repos
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          if [ "$ALIYUN_LOGGED_IN" = "true" ]; then
            IMAGES="${IMAGES}"$'\n'"crpi-kbafcu5p49r7b1k1.cn-hangzhou.personal.cr.aliyuncs.com/lei-rr/new-pro"
            echo "Push target includes Aliyun ACR."
          fi
          echo "images<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repos.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
