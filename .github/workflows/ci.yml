name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Type check & Lint (Backend)
        run: pnpm run lint

      - name: Run Tests (Backend)
        run: pnpm test

      - name: Build Backend
        run: pnpm run build

      - name: Install web dependencies
        run: pnpm install --ignore-workspace
        working-directory: web

      - name: Type check (Frontend)
        run: pnpm run typecheck
        working-directory: web

      - name: Build Frontend
        run: pnpm run build
        working-directory: web
