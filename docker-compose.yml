services:
  new-pro:
    build: .
    image: new-pro:latest
    container_name: new-pro
    restart: unless-stopped
    ports:
      - "${PORT:-3600}:3600"
    environment:
      - SQL_DSN=${SQL_DSN:?SQL_DSN is required (NewAPI PostgreSQL)}
      - LOG_TZ=${LOG_TZ:-Asia/Shanghai}
      - API_KEYS=${API_KEYS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - new-api-network

networks:
  new-api-network:
    external: true
