services:
  new-pro:
    image: ghcr.io/lei-rr/new-pro:latest
    container_name: new-pro
    restart: always
    ports:
      - "${PORT:-3033}:${PORT:-3033}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3033)+'/api/system/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - new-api_network

networks:
  new-api_network:
    external: true
    name: new-api_default
