services:
  new-pro:
    image: ghcr.io/lei-rr/new-pro:latest
    container_name: new-pro
    restart: unless-stopped
    ports:
      - "3033:3033"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3033
      - DATABASE_URL=postgresql://root:your_db_password@new-api-postgres:5432/new-api
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD_HASH=admin123
      - JWT_SECRET=your_jwt_secret
      - LOG_LEVEL=info
      # 实时心跳推流间隔 (秒，默认 5 秒)
      - PULSE_INTERVAL_SEC=5
      # 全量图表与宏观校准间隔 (秒，默认 60 秒)
      - CALIBRATION_INTERVAL_SEC=60
    networks:
      - new-api_network

networks:
  new-api_network:
    external: true
    name: new-api_new-api-network
