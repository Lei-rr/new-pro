services:
  new-pro:
    build: .
    image: new-pro:latest
    container_name: new-pro
    restart: unless-stopped
    ports:
      - "${PORT:-3600}:3600"
    environment:
      - API_KEYS=${API_KEYS:-}
      - LOG_TZ=${LOG_TZ:-local}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      # 直接将宿主机 NewAPI 日志目录挂载至容器 /logs（只读安全挂载）
      - "${LOG_PATH:-/guolei/new-api/logs}:/logs:ro"
      - newpro-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  newpro-data:
